name: "Continuous Integration"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  # Each VM test reports its own status on the pull request.
  checks: write
  contents: read
jobs:
  nix-fmt:
    runs-on: octocat-microvm
    steps:
      - uses: actions/checkout@v6
      - name: Run nix fmt
        run: nix fmt
      - name: Fail if any file would be reformatted
        run: git diff --exit-code
  # Octocat's microVMs build through a host Nix daemon with KVM, so the VM
  # tests run there too, and the store is shared between runs.
  ci:
    runs-on: octocat-microvm
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          # The VM tests are built below, each with its own status, rather
          # than all at once by the flake check.
          flake-check-args: --no-build
          build-attrs: .#checks.x86_64-linux.kiosk .#checks.x86_64-linux.installer
          checks: "true"
