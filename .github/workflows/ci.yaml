name: "Continuous Integration"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  nix-fmt:
    runs-on: octocat-microvm
    steps:
      - uses: actions/checkout@v6
      - name: Run nix fmt
        run: nix fmt
      - name: Fail if any file would be reformatted
        run: git diff --exit-code
  flake-check:
    runs-on: octocat-microvm
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          # Building is left to the checks job, so the tests run side by side.
          flake-check-args: --no-build
          # The microVMs are x86_64 only; the aarch64 job builds the Pi host.
          build-hosts: "false"
          # The tests build the packages they use; the public images are left
          # to the Release workflow and the dev shell to whoever enters it.
          build-devshells: "false"
          build-packages: "false"
  # Octocat's microVMs build through a host Nix daemon with KVM, so the VM
  # tests run there too, and the store is shared between runs. The action
  # builds its attributes one after another, so each check gets its own job
  # to run in parallel and report its own status. The VM tests peak at
  # about 9 GiB of guest memory together, so the host needs no
  # max-parallel.
  checks:
    name: ${{ matrix.check }}
    runs-on: octocat-microvm
    strategy:
      # One broken test must not hide whether the others pass.
      fail-fast: false
      matrix:
        check:
          - installer
          - kiosk
          - kiosk-memory
          - nixos-zoomies
          - splash
          - translations
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          # The flake-check job evaluates the whole flake once.
          flake-check: "false"
          build-hosts: "false"
          build-devshells: "false"
          build-packages: "false"
          build-attrs: .#checks.x86_64-linux.${{ matrix.check }}
  # GitHub's Arm runners build the Raspberry Pi host natively, with the
  # kernel from the nixos-raspberrypi cache. The image itself is left out: it
  # would roughly double the store on a runner with little disk.
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      # The cache key below hashes the sources, which the action would only
      # check out after its inputs are read.
      - uses: actions/checkout@v6
      - uses: ossystems/nix-actions@v1
        with:
          checkout: "false"
          install-nix: "true"
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          # The action keys the cache on flake.* alone, and a cache is never
          # overwritten, so without the sources main would keep restoring the
          # first store saved for a lock and rebuild everything since.
          cache-key-suffix: -${{ runner.arch }}-${{ hashFiles('nix/**', 'shell/**', 'splash/**', 'assets/**') }}
          # The flake-check job already evaluates the flake.
          flake-check: "false"
          build-hosts: "false"
          build-devshells: "false"
          build-packages: "false"
          build-attrs: .#checks.aarch64-linux.nixos-zoomies-pi
