name: "Continuous Integration"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nix-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Run nix fmt
        run: nix fmt
      - name: Fail if any file would be reformatted
        run: git diff --exit-code
  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Evaluate the flake
        run: nix flake check --no-build -L
      - name: Build the reference host
        run: nix build -L .#nixosConfigurations.zoomies.config.system.build.toplevel
  installer-test:
    runs-on: ubuntu-latest
    steps:
      # The ISO, both installs and the system closure outgrow the default
      # runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Install and boot under BIOS and UEFI
        run: nix build -L .#checks.x86_64-linux.installer
