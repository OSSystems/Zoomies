---
modules-search: [ local, "@modules@" ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - summary
  - exec:
      - partition
      - mount
      - zoomies
      - umount
  - show:
      - finished
branding: zoomies
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
