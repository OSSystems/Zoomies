---
efi:
  mountPoint: "/boot/efi"
  # FAT32 needs 256 MiB on disks with 4 KiB sectors.
  recommendedSize: 512MiB
  minimumSize: 256MiB
# The same disk boots under BIOS and UEFI, whichever started the installer.
createHybridBootloaderLayout: true
defaultPartitionTableType: gpt
userSwapChoices:
  - none
initialSwapChoice: none
initialPartitioningChoice: erase
allowManualPartitioning: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
partitionLayout:
  - name: "zoomies"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
# Zoomies is copied ready-built, and its boot cannot ask for a passphrase.
enableLuksAutomatedPartitioning: false
