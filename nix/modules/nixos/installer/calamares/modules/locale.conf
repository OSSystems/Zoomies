---
# Used only when no network answers the GeoIP question below.
region: "Europe"
zone: "London"
useSystemTimezone: false
adjustLiveTimezone: true
localeGenPath: "@supportedLocales@"
# Online, the time zone is guessed from the network address; the grown-up
# still confirms it on the map.
geoip:
  style: "json"
  url: "https://geoip.kde.org/v1/calamares"
